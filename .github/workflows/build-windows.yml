name: Build Windows App

on:
  push:
    branches: [ main ]
    paths:
      - 'windows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'windows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        cd windows
        npm install

    - name: Build Windows App
      run: |
        cd windows
        npm run build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: FileRepairTool-Windows-Installer
        path: windows/dist/*.exe
        if-no-files-found: warn

    - name: Upload Portable
      uses: actions/upload-artifact@v4
      with:
        name: FileRepairTool-Windows-Portable
        path: windows/dist/*portable*.exe
        if-no-files-found: warn
