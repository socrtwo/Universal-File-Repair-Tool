name: Build Windows App

on:
  push:
    branches: [ main ]
    paths:
      - 'windows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'windows/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    environment: release

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        cd windows
        npm install

    - name: Build Windows App
      run: |
        cd windows
        npm run build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Azure login (OIDC, no stored secret)
      if: vars.AZURE_TENANT_ID != ''
      uses: azure/login@v2
      with:
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    - name: Sign Windows binaries with Azure Trusted Signing
      if: vars.AZURE_TENANT_ID != ''
      uses: azure/trusted-signing-action@v0.5.1
      with:
        endpoint: ${{ vars.TS_ENDPOINT }}
        trusted-signing-account-name: ${{ vars.TS_ACCOUNT_NAME }}
        certificate-profile-name: ${{ vars.TS_CERT_PROFILE }}
        files-folder: windows/dist
        files-folder-filter: exe
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: Install Cosign
      uses: sigstore/cosign-installer@v3

    - name: Sign Windows executables with Sigstore
      shell: bash
      run: |
        for exe in windows/dist/*.exe; do
          [ -f "$exe" ] || continue
          echo "Signing $exe ..."
          cosign sign-blob --yes --bundle "${exe}.bundle" "$exe"
          echo "Verifying $exe ..."
          cosign verify-blob --bundle "${exe}.bundle" \
            --certificate-identity-regexp "https://github.com/socrtwo/Universal-File-Repair-Tool/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$exe"
        done

    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: FileRepairTool-Windows-Installer
        path: windows/dist/*.exe
        if-no-files-found: warn

    - name: Upload Portable
      uses: actions/upload-artifact@v4
      with:
        name: FileRepairTool-Windows-Portable
        path: windows/dist/*portable*.exe
        if-no-files-found: warn

    - name: Upload Sigstore bundles
      uses: actions/upload-artifact@v4
      with:
        name: FileRepairTool-Windows-Sigstore
        path: windows/dist/*.exe.bundle
        if-no-files-found: warn
